[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tracewarrant"
version = "0.3.1"
description = "TraceWarrant: telemetry conformance and simulator-neutral performance-model validation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []
classifiers = ["Private :: Do Not Upload", "Development Status :: 2 - Pre-Alpha"]

[project.urls]
Repository = "https://github.com/G26karthik/tracewarrant"
Documentation = "https://github.com/G26karthik/tracewarrant#readme"
Issues = "https://github.com/G26karthik/tracewarrant/issues"
Security = "https://github.com/G26karthik/tracewarrant/security/policy"

[project.scripts]
tracewarrant = "workload_lab.cli:main"
workload-lab = "workload_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "hypothesis>=6.130,<7",
    "ruff>=0.11,<1",
    "hatchling==1.27.0",
    "jsonschema>=4.25,<5",
]
integration = [
    "opentelemetry-sdk==1.45.0",
    "pydantic-ai-slim==2.51.0",
]
validation = [
    "simpy==4.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workload_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
