name: correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.26
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build --no-build-isolation
      - run: uv run workload-lab analyze examples/research-workflow.otlp.json --origin synthetic --format json
      - run: uv run workload-lab simulate examples/scenario.json --output simulation-smoke.json
      - run: uv run workload-lab inspect examples/v3/frames-heldout-base.otlp.json --output conformance-smoke.json
      - run: uv run workload-lab evaluate --protocol docs/v3/frames-frozen/protocol.json --freeze docs/v3/frames-frozen/freeze.json --prediction docs/v3/frames-frozen/simpy.json --prediction docs/v3/frames-frozen/fixed.json --prediction docs/v3/frames-frozen/utilization.json --measurement docs/v3/frames-evaluation/measured-r0.json --measurement docs/v3/frames-evaluation/measured-r1.json --output evaluation-smoke.json
  analytic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.26
      - run: uv sync --locked --group validation
      - run: uv run --group validation python -m benchmarks.validate_simulation --output analytical-validation.json
