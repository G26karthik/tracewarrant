# Copy into your application's .github/workflows/ and commit its own sanitized
# sample/policy artifacts at the paths below. This job does not collect or grade.
name: application-quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install "tracewarrant @ git+https://github.com/G26karthik/tracewarrant.git@v0.5.0"
      - run: tracewarrant qualify-application quality/sample.json --policy quality/policy.json --output quality-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: application-quality-report
          path: quality-report/
