# Copy into your application's .github/workflows/ after committing its neutral
# evidence and job manifest under validation/. This does not collect evidence.
name: validation policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install "tracewarrant @ git+https://github.com/G26karthik/tracewarrant.git@v0.4.0"
      - run: mkdir -p artifacts
      - run: tracewarrant validate-job validation/job.json --output artifacts/tracewarrant
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-policy-report
          path: artifacts/tracewarrant/
          retention-days: 14
